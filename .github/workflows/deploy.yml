name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    name: Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Extract JSX, verify offline asset list
        run: node .github/scripts/check-app.mjs /tmp/app.jsx
      - name: JSX compiles
        run: bun -e 'new Bun.Transpiler({loader:"jsx"}).transformSync(require("fs").readFileSync("/tmp/app.jsx","utf8"))'

  deploy:
    name: Publish
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Stamp sw.js CACHE with the app-asset hash
        run: bash .github/scripts/stamp-cache.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
