const P = {

const people = [

function key(dayId, exIdx, setIdx) { return `${dayId}-${exIdx}-${setIdx}`; }
function dayKeys(map, dayId) { return Object.keys(map).filter((k) => k.startsWith(`${dayId}-`)); }
function hasData(map, dayId) {
  const ks = dayId ? dayKeys(map, dayId) : Object.keys(map);
  return ks.some((k) => map[k] && (map[k].weight || map[k].reps));
}
function isBackup(d) {
  return !!d && typeof d === "object" && !Array.isArray(d) &&
    ((!!d.people && typeof d.people === "object" && !Array.isArray(d.people)) ||
     Array.isArray(d.history) || (!!d.current && typeof d.current === "object"));
}

// Progressive overload suggestion. `entries` is one finished session's logged sets
// for a single exercise; drop-set rows (d1/d2) are skipped — they're failure work at
// reduced load and don't represent the working weight. Returns { lastWeight,
// lastReps, maxWeight, allDivBy5 } — the raw building blocks. The caller combines
// these with the exercise's rep range so exactly one variable moves per session:
//   weight→ only when the top of the range was hit: +2 lb (or +5 when every logged
//           working weight is divisible by 5) on top of the heaviest working weight;
//           reps restart at the min. Bumping from maxWeight — not the best-rep set's
//           weight — stops a lighter top-range set from suggesting a "new" load equal
//           to a heavier set already lifted.
//   reps  → otherwise: last session's best set (the set with the most reps) + 1,
//           and that set's weight holds.
// When there's no usable history the exercise keeps { weight: "", reps: "" }.
function suggestProgression(entries) {
  if (!entries || typeof entries !== "object") return null;
  const weights = [], bestReps = { v: -1, w: "" };
  Object.keys(entries).forEach((k) => {
    if (k.split("-").pop().startsWith("d")) return; // drop-set rows aren't working sets
    const s = entries[k];
    if (s && s.weight) { const w = parseFloat(s.weight); if (!isNaN(w)) weights.push(w); }
    if (s && s.reps) { const r = parseFloat(s.reps); if (!isNaN(r) && r > bestReps.v) { bestReps.v = r; bestReps.w = s.weight; } }
  });
  if (bestReps.v < 0) return null;
  return { lastWeight: bestReps.w, lastReps: bestReps.v, maxWeight: weights.length ? Math.max(...weights) : null, allDivBy5: weights.length > 0 && weights.every((w) => w % 5 === 0) };
}

// localStorage helpers — synchronous, work in any real browser
function loadJSON(k, fallback) {
  try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; }
  catch (_) { return fallback; }
}
function saveJSON(k, val) {
  try { localStorage.setItem(k, JSON.stringify(val)); } catch (_) {}
}
// Shape guards — corrupt localStorage (manual edit, partial write) must never blank
// the page; fall back to the empty shape and keep training.
function isMap(v) { return !!v && typeof v === "object" && !Array.isArray(v); }
function loadLogs(id) { const v = loadJSON(logsKey(id), {}); return isMap(v) ? v : {}; }
function loadHistory(id) { const v = loadJSON(historyKey(id), []); return Array.isArray(v) ? v : []; }

function Routine() {
  const [activeDay, setActiveDay] = useState("A");
  const [expanded, setExpanded] = useState(null);
  const [cueOpen, setCueOpen] = useState(null);
  const [personId, setPersonId] = useState(() => {
    const saved = loadJSON(STORE_PERSON, DEFAULT_PERSON);
    return people.some((p) => p.id === saved) ? saved : DEFAULT_PERSON;
  });
  const [logs, setLogs] = useState(() => loadLogs(personId));
  const [history, setHistory] = useState(() => loadHistory(personId));
  const [view, setView] = useState("workout");
  const [expandedSession, setExpandedSession] = useState(null);
  const [notice, setNotice] = useState("");
  const [importOpen, setImportOpen] = useState(false);
  const [importText, setImportText] = useState("");
  const [suggestions, setSuggestions] = useState(null);
  const [historyFilter, setHistoryFilter] = useState("me");
  const [dataTick, setDataTick] = useState(0); // bumped after writes to non-active profiles' stores
  const noticeTimer = useRef(null);

  const person = people.find((p) => p.id === personId) || people[0];
  const day = person.days.find((d) => d.id === activeDay) || person.days[0];

  // Per-exercise insight for the active day, compared only against the most recent
  // session of that same day type (Day A never looks at Day B). `last` is what was
  // actually logged; `next` applies the one-variable-at-a-time progression rule.
  const insights = useMemo(() => {
    const byDay = {};
    history.forEach((s) => { if (s && s.dayId && s.entries && !byDay[s.dayId]) byDay[s.dayId] = s; });
    const hist = byDay[day.id];
    return day.exercises.map((ex, i) => {
      if (!hist) return { last: null, next: null };
      const entries = {};
      Object.keys(hist.entries || {}).filter((k) => k.startsWith(`${day.id}-${i}-`))
        .forEach((k) => { entries[k] = hist.entries[k]; });
      const prog = suggestProgression(entries);
      if (!prog) return { last: null, next: null };

      const parsed = String(ex.reps).split("–").map((n) => parseInt(n, 10)).filter((n) => !isNaN(n));
      const minReps = parsed.length ? Math.min(...parsed) : 6;
      const maxReps = parsed.length ? Math.max(...parsed) : minReps;

      // Exactly one variable moves per session — never reps and weight together.
      const hasWeight = prog.lastWeight !== "" && !isNaN(Number(prog.lastWeight));
      const bumpBase = prog.maxWeight != null ? Number(prog.maxWeight) : hasWeight ? Number(prog.lastWeight) : null;
      let next;
      if (prog.lastReps >= maxReps) {
        // Top of the range hit: raise the load one step, restart at the bottom.
        if (bumpBase == null) next = { reps: maxReps, weight: "", weightNote: "", repsNote: "Top of range — log a weight to raise the load" };
        else { const step = prog.allDivBy5 ? 5 : 2; next = { reps: minReps, weight: String(bumpBase + step), weightNote: prog.allDivBy5 ? "+5 (5s)" : "+2 lb", repsNote: "New load — restart at min" }; }
      } else {
        // Below the top: hold the load, climb one rep toward it.
        next = { reps: Math.min(prog.lastReps + 1, maxReps), weight: prog.lastWeight || "", weightNote: hasWeight ? "Held weight" : "", repsNote: "Reps +1" };
      }
      return { last: { weight: prog.lastWeight, reps: prog.lastReps }, next };
    });
  }, [history, day.id]);

  // Whether any suggestions exist at all (so we only show the toggle when useful).
  const suggestionAvailable = useMemo(() => insights.some((s) => !!s.next), [insights]);

  // Auto-enable the suggestion overlay the first time history exists; the user can
  // toggle it off (or on) afterward.
  useEffect(() => {
    if (suggestionAvailable && suggestions === null) setSuggestions(true);
  }, [suggestionAvailable]);

  function flash(msg) {
    setNotice(msg);
    clearTimeout(noticeTimer.current);
    noticeTimer.current = setTimeout(() => setNotice(""), 2600);
  }

  // Switching people keeps the day, view and scroll position — both of you train the
  // same A/B cycle, so "I'm on Day A" is almost always true for the other person too.
  function switchPerson(id) {
    if (id === personId) return;
    setPersonId(id);
    saveJSON(STORE_PERSON, id);
    setLogs(loadLogs(id));
    setHistory(loadHistory(id));
    setExpanded(null);
    setCueOpen(null);
    setExpandedSession(null);
  }

  // One line of status per person for the header pills: in-progress sheet, or last saved date.
  const personStatus = useMemo(() => {
    const out = {};
    people.forEach((p) => {
      const h = p.id === personId ? history : loadHistory(p.id);
      const l = p.id === personId ? logs : loadLogs(p.id);
      const first = Array.isArray(h) ? h[0] : null;
      out[p.id] = { inProgress: hasData(l), lastDate: first && first.date ? fmtDate(first.date) : "" };
    });
    return out;
    // dataTick re-reads the other profiles' stores after an import touches them.
  }, [personId, history, logs, dataTick]);

  function updateLog(dayId, exIdx, setIdx, field, value) {
    const k = key(dayId, exIdx, setIdx);
    setLogs((prev) => {
      const next = { ...prev, [k]: { ...prev[k], [field]: value } };
      saveJSON(logsKey(personId), next);
      return next;
    });
  }
  function getLog(dayId, exIdx, setIdx) { return logs[key(dayId, exIdx, setIdx)] || { weight: "", reps: "" }; }
  function hasAnyLog(dayId, exIdx) {
    return Object.keys(logs).some((k) => k.startsWith(`${dayId}-${exIdx}-`) && (logs[k]?.weight || logs[k]?.reps));
  }
  function clearLogs() { localStorage.removeItem(logsKey(personId)); setLogs({}); }
  function clearDay(dayId) {
    setLogs((prev) => {
      const next = {};
      Object.keys(prev).forEach((k) => { if (!k.startsWith(`${dayId}-`)) next[k] = prev[k]; });
      saveJSON(logsKey(personId), next);
      return next;
    });
  }

  function persistHistory(next) { setHistory(next); saveJSON(historyKey(personId), next); }

  function finishSession() {
    if (!hasData(logs, activeDay)) { flash(`Nothing logged for ${day.focus} yet — fill in some sets first.`); return; }
    if (!window.confirm(`Save ${day.focus} to ${person.name}'s history? The current sheet will be cleared.`)) return;
    const entries = {};
    dayKeys(logs, activeDay).forEach((k) => { entries[k] = { ...logs[k] }; });
    const session = { id: Date.now(), date: new Date().toISOString(), personId, dayId: activeDay, focus: day.focus, entries };
    persistHistory([session, ...history]);
    clearDay(activeDay);
    flash(`Saved ${day.focus} to ${person.name}'s history. Sheet cleared.`);
    setView("history");
  }
  // Real file download — works in any browser
  function exportData() {
    const payload = { app: "minimalist-full-body", version: 2, exportedAt: new Date().toISOString(), people: {} };
    people.forEach((p) => {
      payload.people[p.id] = p.id === personId
        ? { current: logs, history }
        : { current: loadLogs(p.id), history: loadHistory(p.id) };
    });
    const json = JSON.stringify(payload, null, 2);
    try {
      const blob = new Blob([json], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `workout-backup-${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      flash("Backup downloaded — all profiles.");
    } catch (_) {
      navigator.clipboard?.writeText(json).then(() => flash("Copied backup to clipboard.")).catch(() => flash("Export failed."));
    }
  }

  function mergeHistory(existing, incoming) {
    const valid = (Array.isArray(incoming) ? incoming : []).filter(
      (s) => s && typeof s === "object" && s.id != null && s.entries && typeof s.entries === "object"
    );
    const byId = {};
    [...valid, ...existing].forEach((s) => { if (s && s.id) byId[s.id] = s; });
    return { merged: Object.values(byId).sort((a, b) => new Date(b.date) - new Date(a.date)), seen: valid.length };
  }

  function applyImport(data) {
    if (!isBackup(data)) { flash("That doesn't look like a workout backup."); return; }

    // v2: { people: { id: {current, history} } }. v1: { current, history } → Luis.
    const buckets = data.people && typeof data.people === "object" && !Array.isArray(data.people)
      ? data.people
      : { [DEFAULT_PERSON]: { current: data.current, history: data.history } };

    let added = 0, dup = 0, skipped = 0;
    Object.keys(buckets).forEach((pid) => {
      if (!people.some((p) => p.id === pid)) { skipped++; return; }
      const bucket = buckets[pid] || {};
      const isActive = pid === personId;

      const existingHistory = isActive ? history : loadHistory(pid);
      const { merged, seen } = mergeHistory(existingHistory, bucket.history);
      const gained = merged.length - existingHistory.length;
      added += gained; dup += seen - gained;
      saveJSON(historyKey(pid), merged);
      if (isActive) setHistory(merged);

      const incoming = isMap(bucket.current) ? bucket.current : {};
      const live = isActive ? logs : loadLogs(pid);
      if (!hasData(live) && Object.keys(incoming).length) {
        saveJSON(logsKey(pid), incoming);
        if (isActive) setLogs(incoming);
      }
    });

    flash(`Imported ${added} new session${added === 1 ? "" : "s"} · ${dup} already present${skipped ? ` · skipped ${skipped} unknown profile${skipped === 1 ? "" : "s"}` : ""}.`);
    setImportOpen(false); setImportText(""); setView("history");
    setDataTick((t) => t + 1); // other profiles' stores were written; refresh pill status
  }

  // Real file picker — works in any browser
  function importFromFile() {
    const input = document.createElement("input");
    input.type = "file"; input.accept = "application/json,.json";
    input.onchange = (e) => {
      const file = e.target.files?.[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => { try { applyImport(JSON.parse(ev.target.result)); } catch (_) { flash("Couldn't read that file."); } };
      reader.readAsText(file);
    };
    input.click();
  }
  function importFromText() {
    try { applyImport(JSON.parse(importText.trim())); } catch (_) { flash("That doesn't look like valid backup JSON."); }
  }

  function fmtDate(iso) {
    try {
      const d = new Date(iso);
      return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }) + " · " +
        d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    } catch (_) { return iso; }
  }

  // `who` is the session's own person — needed because the combined timeline shows
  // sessions whose routine (exercise order!) differs from the active person's.
  function sessionSummary(session, who) {
    const d = (who || person).days.find((x) => x.id === session.dayId);
    if (!d) return [];
    const entries = session.entries || {};
    const rank = (k) => (k[0] === "d" ? 100 + Number(k.slice(1)) : Number(k));
    return d.exercises.map((ex, i) => {
      const sets = [];
      Object.keys(entries).filter((k) => k.startsWith(`${session.dayId}-${i}-`)).forEach((k) => {
        const setKey = k.split("-").slice(2).join("-");
        const v = entries[k];
        if (v && (v.weight || v.reps)) sets.push({ setKey, ...v });
      });
      sets.sort((a, b) => rank(a.setKey) - rank(b.setKey));
      return { name: ex.name, sets };
    }).filter((ex) => ex.sets.length > 0);
  }

  // Sessions saved before multi-person support have no personId — they belong to Luis.
  function personOf(session) {
    return people.find((p) => p.id === session.personId) || people[0];
  }

  // the per-person stores are never touched.

    const all = [];
    people.forEach((p) => {
      const h = p.id === personId ? history : loadHistory(p.id);
      (Array.isArray(h) ? h : []).forEach((s) => { if (s && s.id != null) all.push(s); });
    });
    return all.sort((a, b) => new Date(b.date) - new Date(a.date));
  }, [personId, history, dataTick]);

  const historyCount = historyFilter === "both" ? combinedHistory.length : history.length;

  // combined "both" timeline can remove either person's row without switching.
  function deleteSessionIn(pid, id) {
    const existing = pid === personId ? history : loadHistory(pid);
    const next = (Array.isArray(existing) ? existing : []).filter((s) => s.id !== id);
    saveJSON(historyKey(pid), next);
    if (pid === personId) setHistory(next);

  }

  // are left alone — they're failure work at reduced load and can't be pre-filled.

      return nextMap;

                          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8, gap: 8 }}>
                            <span style={{ fontSize: 11, fontFamily: "'DM Mono'", color: day.color, textTransform: "uppercase", letterSpacing: "0.08em" }}>suggested next time</span>
                            <button onClick={(e) => { e.stopPropagation(); prefillExercise(i, ins.next); flash(`Filled ${ex.name} with ${ins.next.weight || "—"} lb × ${ins.next.reps}.`); }} style={{ background: day.color + "22", border: `1px solid ${day.color}66`, color: day.color, fontFamily: "'DM Mono'", fontSize: 10.5, fontWeight: 500, cursor: "pointer", padding: "4px 10px", borderRadius: 4, letterSpacing: "0.05em" }}>
                              use these numbers
                            </button>
                          </div>
                          <div style={{ display: "flex", gap: 16, flexWrap: "wrap" }}>
                            <div style={{ fontSize: 12.5, color: "#cfd6de" }}>
                              <span style={{ color: "#888" }}>reps → </span>
                              <span style={{ fontWeight: 500 }}>{ins.next.reps}</span>
                              {ins.next.repsNote && <span style={{ color: "#888", marginLeft: 6, fontSize: 11 }}>({ins.next.repsNote})</span>}
                            </div>
                            <div style={{ fontSize: 12.5, color: "#cfd6de" }}>
                              <span style={{ color: "#888" }}>weight → </span>
                              <span style={{ fontWeight: 500 }}>{ins.next.weight || "—"} lb</span>
                              {ins.next.weightNote && <span style={{ color: "#888", marginLeft: 6, fontSize: 11 }}>({ins.next.weightNote})</span>}
                            </div>
                          </div>
                        </div>
                      )}

                      <div style={{ borderTop: "1px solid #1a1c21", paddingTop: 14 }}>
                        <div style={{ fontSize: 11, color: "#444", fontFamily: "'DM Mono'", textTransform: "uppercase", marginBottom: 10 }}>Log weight &amp; reps</div>
                        <div style={{ display: "grid", gridTemplateColumns: "52px 1fr 1fr", gap: "6px 10px", alignItems: "center" }}>
                          <div />
                          <div style={{ fontSize: 10, color: "#444", fontFamily: "'DM Mono'", textTransform: "uppercase", textAlign: "center" }}>lbs</div>
                          <div style={{ fontSize: 10, color: "#444", fontFamily: "'DM Mono'", textTransform: "uppercase", textAlign: "center" }}>reps done</div>

                          {Array.from({ length: ex.sets }).map((_, s) => {
                            const isDropTop = ex.dropSet && s === ex.sets - 1;
                            const log = getLog(day.id, i, s);
                            const filled = log.weight || log.reps;
                            return (
                              <React.Fragment key={`set-${s}`}>
                                <div style={{ fontFamily: "'DM Mono'", fontSize: 11, color: filled ? day.color : "#555" }}>{isDropTop ? "S" + (s + 1) + " ⬇" : "S" + (s + 1)}</div>
                                <input type="text" inputMode="decimal" placeholder="—" value={log.weight} onClick={(e) => e.stopPropagation()} onChange={(e) => updateLog(day.id, i, s, "weight", e.target.value)} style={inputStyle(filled, day.color)} />
                                <input type="text" inputMode="numeric" placeholder="—" value={log.reps} onClick={(e) => e.stopPropagation()} onChange={(e) => updateLog(day.id, i, s, "reps", e.target.value)} style={inputStyle(filled, day.color)} />
                              </React.Fragment>
                            );
                          })}

                          {ex.dropSet && ["d1", "d2"].map((dk, di) => {
                            const log = getLog(day.id, i, dk);
                            const filled = log.weight || log.reps;
                            return (
                              <React.Fragment key={`drop-${dk}`}>
                                <div style={{ fontFamily: "'DM Mono'", fontSize: 11, color: filled ? day.color : "#555", paddingLeft: 12 }}>↳ d{di + 1}</div>
                                <input type="text" inputMode="decimal" placeholder="—" value={log.weight} onClick={(e) => e.stopPropagation()} onChange={(e) => updateLog(day.id, i, dk, "weight", e.target.value)} style={inputStyle(filled, day.color)} />
                                <input type="text" inputMode="numeric" placeholder="—" value={log.reps} onClick={(e) => e.stopPropagation()} onChange={(e) => updateLog(day.id, i, dk, "reps", e.target.value)} style={inputStyle(filled, day.color)} />
                              </React.Fragment>
                            );
                          })}
                        </div>
                        {ex.dropSet && <div style={{ fontSize: 11, color: "#3f3f3f", marginTop: 8, fontStyle: "italic" }}>S{ex.sets} ⬇ = drop set's top weight · ↳ d1, d2 = the two load drops</div>}
                      </div>
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {/* Sticky finish bar takes the place of the inline button */}
          <div style={{ paddingBottom: 96 }} />
        </div>
      </>)}

      {/* PLAN VIEW — reference content, out of the way of logging */}
      {view === "plan" && (
        <div style={{ maxWidth: 720, margin: "0 auto", padding: "24px 28px 40px" }}>
          <div style={{ background: "#111317", border: "1px solid #1c1e24", borderRadius: 8, padding: "16px" }}>
            <div style={{ fontSize: 11, color: "#444", fontFamily: "'DM Mono'", textTransform: "uppercase", marginBottom: 12 }}>{person.name} · weekly direct sets per muscle</div>
            {person.weeklySets.map(({ muscle, sets, color }) => (
              <div key={muscle} style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 8 }}>
                <div style={{ width: 140, fontSize: 12, color: "#777" }}>{muscle}</div>
                <div style={{ flex: 1, background: "#1a1c22", borderRadius: 3, height: 6, overflow: "hidden" }}><div style={{ width: `${(sets / 8) * 100}%`, height: "100%", background: color, borderRadius: 3 }} /></div>
                <div style={{ fontSize: 11, fontFamily: "'DM Mono'", color: "#555", width: 28, textAlign: "right" }}>{sets}</div>
              </div>
            ))}
            <div style={{ fontSize: 11, color: "#3f3f3f", marginTop: 10, fontStyle: "italic", lineHeight: 1.5 }}>{person.volumeNote}</div>
          </div>

          <div style={{ marginTop: 28 }}>
            <div style={{ fontSize: 11, color: "#444", fontFamily: "'DM Mono'", textTransform: "uppercase", marginBottom: 14 }}>Why this works</div>
            <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
              {person.principles.map(({ icon, title, body }) => (
                <div key={title} style={{ background: "#111317", border: "1px solid #1c1e24", borderRadius: 8, padding: "12px 14px" }}>
                  <div style={{ fontSize: 16, marginBottom: 6 }}>{icon}</div>
                  <div style={{ fontSize: 13, fontWeight: 500, color: "#ccc", marginBottom: 4 }}>{title}</div>
                  <div style={{ fontSize: 12, color: "#666", lineHeight: 1.5 }}>{body}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* STICKY FINISH BAR — always reachable while logging */}
      {view === "workout" && hasData(logs, activeDay) && (
        <div style={{ position: "fixed", bottom: 0, left: 0, right: 0, background: "rgba(14,15,17,0.96)", borderTop: `1px solid ${day.color}44`, padding: "10px 28px calc(10px + env(safe-area-inset-bottom))", zIndex: 150 }}>
          <div style={{ maxWidth: 720, margin: "0 auto", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12 }}>
            <span style={{ fontFamily: "'DM Mono'", fontSize: 11, color: "#888", whiteSpace: "nowrap" }}>
              {day.id} · {person.name} · {day.exercises.filter((_, i) => hasAnyLog(day.id, i)).length}/{day.exercises.length} ex
            </span>
            <button onClick={finishSession} style={{ background: day.color + "16", border: `1px solid ${day.color}66`, color: day.color, fontFamily: "'DM Mono'", fontSize: 12.5, fontWeight: 500, cursor: "pointer", padding: "10px 18px", borderRadius: 7, letterSpacing: "0.05em", whiteSpace: "nowrap" }}>
              ✓ Finish &amp; save
            </button>
          </div>
        </div>
      )}

      {/* HISTORY VIEW */}
      {view === "history" && (() => {
        const both = historyFilter === "both";
        const list = both ? combinedHistory : history;
        return (
          <div style={{ maxWidth: 720, margin: "0 auto", padding: "24px 28px 40px" }}>
            {list.length === 0 ? (
              <div style={{ textAlign: "center", padding: "60px 20px", color: "#555" }}>
                <div style={{ fontSize: 28, marginBottom: 12 }}>📋</div>
                <div style={{ fontSize: 14, color: "#888", marginBottom: 6 }}>No saved sessions yet</div>
                <div style={{ fontSize: 12.5, color: "#555", lineHeight: 1.6, maxWidth: 360, margin: "0 auto" }}>Log your sets in the Workout tab, then tap Finish &amp; save to snapshot the session here.</div>
              </div>
            ) : (<>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16, gap: 8 }}>
                <span style={{ fontSize: 11, color: "#444", fontFamily: "'DM Mono'", textTransform: "uppercase", letterSpacing: "0.1em" }}>{list.length} session{list.length !== 1 ? "s" : ""}{both ? " · both" : ` · ${person.name}`}</span>
                <div style={{ display: "flex", gap: 4 }}>
                  {[{ id: "me", label: person.name }, { id: "both", label: "Both" }].map((f) => (
                    <button key={f.id} onClick={() => { setHistoryFilter(f.id); setExpandedSession(null); }} style={{ background: historyFilter === f.id ? "#1a1c22" : "none", border: `1px solid ${historyFilter === f.id ? "#33363e" : "#22242b"}`, color: historyFilter === f.id ? "#ccc" : "#555", fontFamily: "'DM Mono'", fontSize: 10.5, cursor: "pointer", padding: "4px 10px", borderRadius: 999, letterSpacing: "0.05em" }}>{f.label}</button>
                  ))}
                  <button onClick={exportData} style={btn()}>↓ export</button>
                </div>
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                {list.map((session) => {
                  const who = personOf(session);
                  const d = who.days.find((x) => x.id === session.dayId);
                  const accent = d ? d.color : "#888";
                  const isOpen = expandedSession === session.id;
                  const summary = sessionSummary(session, who);
                  return (
                    <div key={session.id} style={{ background: isOpen ? "#14161a" : "#111317", border: `1px solid ${isOpen ? accent + "55" : "#1c1e24"}`, borderRadius: 8, overflow: "hidden" }}>
                      <div onClick={() => setExpandedSession(isOpen ? null : session.id)} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "14px 16px", cursor: "pointer" }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                          <span style={{ width: 8, height: 8, borderRadius: 4, background: who.color, display: "inline-block" }} />
                          <div>
                            <div style={{ fontSize: 14, fontWeight: 500, color: "#ddd" }}>{session.focus}{both && <span style={{ color: who.color, fontFamily: "'DM Mono'", fontSize: 11, marginLeft: 8 }}>{who.name}</span>}</div>
                            <div style={{ fontSize: 12, color: "#555", marginTop: 2, fontFamily: "'DM Mono'" }}>{fmtDate(session.date)}</div>
                          </div>
                        </div>
                        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                          <span style={{ fontSize: 11, color: "#555", fontFamily: "'DM Mono'" }}>{summary.length} ex</span>
                          <span style={{ color: "#333", fontSize: 14 }}>{isOpen ? "−" : "+"}</span>
                        </div>
                      </div>
                      {isOpen && (
                        <div style={{ borderTop: "1px solid #1e2025", padding: "14px 16px" }}>
                          {summary.map((ex, idx) => (
                            <div key={idx} style={{ marginBottom: idx < summary.length - 1 ? 14 : 0 }}>
                              <div style={{ fontSize: 12.5, color: "#bbb", fontWeight: 500, marginBottom: 6 }}>{ex.name}</div>
                              <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                                {ex.sets.map((s, si) => (
                                  <span key={si} style={{ fontFamily: "'DM Mono'", fontSize: 11.5, color: "#999", background: "#0e0f11", border: "1px solid #222", borderRadius: 4, padding: "3px 8px" }}>
                                    <span style={{ color: "#555" }}>{s.setKey.startsWith("d") ? "↳" + s.setKey : "S" + (Number(s.setKey) + 1)}</span> {s.weight || "—"}<span style={{ color: "#444" }}>lb</span> × {s.reps || "—"}
                                  </span>
                                ))}
                              </div>
                            </div>
                          ))}
                          <button onClick={(e) => { e.stopPropagation(); const pid = both ? who.id : personId; if (!window.confirm(`Delete ${session.focus} from ${who.name}'s history (${fmtDate(session.date)})? This can't be undone.`)) return; deleteSessionIn(pid, session.id); }} style={{ marginTop: 14, ...btn("#2a1a1a", "#6b3030") }}>delete session</button>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </>)}
          </div>
        );
      })()}
    </div>
  );
}

function btn(border = "#2a2c33", color = "#999") {
  return { background: "none", border: `1px solid ${border}`, borderRadius: 5, color, fontFamily: "'DM Mono'", fontSize: 11, cursor: "pointer", padding: "6px 10px", whiteSpace: "nowrap", letterSpacing: "0.05em" };
}
const modalBg = { position: "fixed", inset: 0, background: "rgba(0,0,0,0.7)", zIndex: 300, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 };
const modalCard = { background: "#14161a", border: "1px solid #2a2c33", borderRadius: 12, padding: 20, width: "100%", maxWidth: 460, boxShadow: "0 10px 40px rgba(0,0,0,0.6)" };

ReactDOM.createRoot(document.getElementById("root")).render(<Routine />);

// Register the service worker for offline + installability
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
  </script>
</body>
</html>
